<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <meta name="apple-mobile-web-app-title" content="Dice Throne" />
  <meta name="theme-color" content="#09070F" />
  <title>DICE THRONE TRACKER</title>
  <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;700;900&family=Rajdhani:wght@500;600;700&family=Inter:wght@400;500;600&display=swap" rel="stylesheet" />
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --gold:      #39FF6A;
      --gold-dim:  #1FA84A;
      --parchment: #DFF5E6;
      --ash:       #8FBFA0;
      --dark0:     #040D08;
      --dark1:     #0A1A12;
      --dark2:     #122A1C;
      --dark3:     #1B3D28;
      --dark4:     #2C5A3C;
      --win:       #4CAF50;
      --loss:      #C0392B;
      --tie:       #E67E22;
    }

    html, body {
      height: 100%;
      background: var(--dark0);
      background-image:
        radial-gradient(circle at 15% 20%, #1FA84A12 0%, transparent 35%),
        radial-gradient(circle at 85% 75%, #39FF6A0A 0%, transparent 40%);
      color: var(--parchment);
      font-family: 'Inter', sans-serif;
      overflow-x: hidden;
      -webkit-tap-highlight-color: transparent;
    }

    /* ── TREE SILHOUETTE BACKDROP ── */
    .tree-backdrop {
      position: fixed;
      inset: 0;
      z-index: 0;
      pointer-events: none;
      opacity: 0.5;
    }
    .tree-backdrop svg {
      position: absolute;
      bottom: 0;
      width: 100%;
      height: auto;
    }
    .tree-backdrop .layer-far   { opacity: 0.35; filter: blur(0.5px); }
    .tree-backdrop .layer-near  { opacity: 0.55; }

    /* Floating leaf particles */
    .leaf-particle {
      position: fixed;
      z-index: 0;
      pointer-events: none;
      font-size: 14px;
      opacity: 0.25;
      filter: drop-shadow(0 0 4px #39FF6A55);
      animation: leafFall linear infinite;
    }
    @keyframes leafFall {
      0%   { transform: translateY(-5vh) rotate(0deg) translateX(0); opacity: 0; }
      10%  { opacity: 0.3; }
      90%  { opacity: 0.2; }
      100% { transform: translateY(105vh) rotate(360deg) translateX(20px); opacity: 0; }
    }

    body {
      padding-top: env(safe-area-inset-top);
      padding-bottom: env(safe-area-inset-bottom);
    }

    button { font-family: 'Inter', sans-serif; touch-action: manipulation; cursor: pointer; }
    input  { font-family: 'Inter', sans-serif; }
    ::-webkit-scrollbar { width: 0; }

    /* ── HEADER ── */
    .header {
      position: relative; z-index: 10;
      background: linear-gradient(180deg, #020A05 0%, #0A2014 50%, var(--dark1) 100%);
      border-bottom: 1px solid #39FF6A33;
      padding: env(safe-area-inset-top) 0 0;
      text-align: center;
      overflow: visible;
    }
    .header-inner {
      padding: 18px 16px 0;
      position: relative;
    }
    .header-eyebrow {
      font-family: 'Rajdhani', sans-serif;
      font-size: 9px;
      letter-spacing: 5px;
      color: var(--gold-dim);
      text-transform: uppercase;
      margin-bottom: 6px;
    }
    .header h1 {
      font-family: 'Orbitron', sans-serif;
      font-weight: 900;
      font-size: 28px;
      letter-spacing: 5px;
      color: var(--parchment);
      text-shadow: 0 0 30px #39FF6A55, 0 2px 8px #00000099;
      line-height: 1;
    }
    .header h1 span { color: var(--gold); }
    .header-rule {
      display: flex; align-items: center; gap: 8px;
      margin: 8px auto 0; max-width: 220px;
    }
    .header-rule::before, .header-rule::after {
      content: ''; flex: 1; height: 1px;
      background: linear-gradient(90deg, transparent, var(--gold-dim), transparent);
    }
    .header-rule span { font-size: 12px; color: var(--gold-dim); }
    .header-sub {
      font-family: 'Rajdhani', sans-serif;
      font-size: 11px; letter-spacing: 3px;
      color: var(--ash); text-transform: uppercase;
      margin-top: 4px;
    }

    /* Mad King */
    .mad-king-wrap {
      position: relative;
      height: 130px;
      margin-top: 8px;
      overflow: visible;
    }
    .mad-king-wrap img {
      position: absolute;
      bottom: -10px;
      left: 50%;
      transform: translateX(-50%);
      height: 160px;
      filter: drop-shadow(0 0 16px #39FF6A66) drop-shadow(0 0 32px #8B000044);
      pointer-events: none;
    }

    /* Global stats */
    .global-stats {
      display: flex;
      justify-content: center;
      background: #00000033;
      border-top: 1px solid #39FF6A22;
      margin-top: 10px;
    }
    .global-stat {
      flex: 1; text-align: center;
      padding: 10px 0;
      border-right: 1px solid #39FF6A22;
    }
    .global-stat:last-child { border-right: none; }
    .global-stat-val {
      font-family: 'Orbitron', sans-serif;
      font-size: 16px; font-weight: 700;
      color: var(--gold);
    }
    .global-stat-label {
      font-size: 8px; color: var(--ash);
      letter-spacing: 1.5px; text-transform: uppercase;
      margin-top: 1px;
    }

    /* ── BOTTOM NAV ── */
    .bottom-nav {
      position: fixed;
      bottom: 0; left: 0; right: 0;
      z-index: 100;
      display: flex;
      background: var(--dark1);
      border-top: 1px solid #39FF6A33;
      padding-bottom: env(safe-area-inset-bottom);
    }
    .nav-btn {
      flex: 1;
      background: transparent;
      border: none;
      color: var(--dark4);
      padding: 12px 8px 10px;
      font-family: 'Rajdhani', sans-serif;
      font-size: 10px;
      font-weight: 700;
      letter-spacing: 1.5px;
      text-transform: uppercase;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 3px;
      transition: color 0.15s;
    }
    .nav-btn.active { color: var(--gold); }
    .nav-btn-icon { font-size: 20px; line-height: 1; }

    /* ── MAIN SCROLL ── */
    .main {
      position: relative; z-index: 1;
      padding: 14px 12px 90px;
    }

    /* ── SEARCH & FILTERS ── */
    .search-wrap { position: relative; margin-bottom: 10px; }
    .search-input {
      width: 100%;
      background: var(--dark2);
      border: 1px solid #39FF6A33;
      border-radius: 10px;
      padding: 12px 14px 12px 40px;
      color: var(--parchment);
      font-size: 15px;
      outline: none;
      -webkit-appearance: none;
    }
    .search-input::placeholder { color: var(--dark4); }
    .search-icon {
      position: absolute; left: 13px; top: 50%;
      transform: translateY(-50%);
      color: var(--dark4); font-size: 15px; pointer-events: none;
    }

    /* ── DROPDOWN FILTER ── */
    .dropdown-wrap {
      position: relative;
      margin-bottom: 12px;
      z-index: 50;
    }
    .dropdown-trigger {
      width: 100%;
      display: flex; align-items: center; justify-content: space-between;
      background: var(--dark2);
      border: 1px solid #39FF6A55;
      border-radius: 10px;
      padding: 12px 14px;
      color: var(--gold);
      font-family: 'Rajdhani', sans-serif;
      font-size: 14px; font-weight: 700;
      letter-spacing: 1.5px;
      text-transform: uppercase;
      cursor: pointer;
      transition: border-color 0.15s;
    }
    .dropdown-trigger.open {
      border-color: var(--gold);
      border-radius: 10px 10px 0 0;
    }
    .dropdown-arrow {
      font-size: 10px;
      transition: transform 0.2s;
      color: var(--gold-dim);
    }
    .dropdown-arrow.open { transform: rotate(180deg); }
    .dropdown-menu {
      position: absolute; top: 100%; left: 0; right: 0;
      background: var(--dark2);
      border: 1px solid var(--gold);
      border-top: none;
      border-radius: 0 0 10px 10px;
      overflow-y: auto;
      max-height: 0;
      transition: max-height 0.25s ease;
      z-index: 999;
      box-shadow: 0 12px 32px #00000088;
    }
    .dropdown-menu.open { max-height: 320px; }
    .dropdown-option {
      width: 100%;
      display: flex; align-items: center; justify-content: space-between;
      background: transparent;
      border: none;
      border-top: 1px solid #39FF6A18;
      padding: 13px 16px;
      color: var(--ash);
      font-family: 'Rajdhani', sans-serif;
      font-size: 14px; font-weight: 600;
      letter-spacing: 1px;
      text-align: left;
      cursor: pointer;
      transition: background 0.1s, color 0.1s;
    }
    .dropdown-option:first-child { border-top: none; }
    .dropdown-option:active { background: #39FF6A15; }
    .dropdown-option.active {
      color: var(--gold);
      background: #39FF6A12;
    }
    .dropdown-option-check { font-size: 12px; color: var(--gold); }

    /* ── BANNER ── */
    .season-banner {
      display: flex; align-items: center; gap: 8px;
      border-radius: 8px; padding: 9px 12px;
      margin-bottom: 12px;
      font-family: 'Rajdhani', sans-serif;
      font-size: 13px; font-weight: 600;
    }
    .season-banner.vanguard {
      background: #BF360C15; border: 1px solid #F57F1733; color: #F57F17;
    }
    .season-banner.single {
      background: #7986CB15; border: 1px solid #AB47BC33; color: #CE93D8;
    }

    /* ── CARD — single column, full width on mobile ── */
    .grid {
      display: flex; flex-direction: column; gap: 12px;
    }
    .card {
      background: linear-gradient(155deg, var(--dark2) 0%, var(--dark1) 100%);
      border: 1px solid #39FF6A22;
      border-radius: 14px;
      overflow: hidden;
      position: relative;
    }
    .card::before {
      content: '';
      position: absolute; top: 0; left: 0; right: 0; height: 1px;
      background: linear-gradient(90deg, transparent, var(--gold-dim), transparent);
      opacity: 0.5;
    }
    .card::after {
      content: '🌿';
      position: absolute;
      top: -2px; right: 6px;
      font-size: 13px;
      opacity: 0.45;
      transform: rotate(15deg);
      filter: drop-shadow(0 0 3px #39FF6A66);
      pointer-events: none;
    }
    .card-top {
      padding: 14px 14px 10px;
      display: flex; align-items: center; gap: 12px;
    }

    /* Dice */
    .dice {
      width: 52px; height: 52px; flex-shrink: 0;
      background: linear-gradient(135deg, var(--dark3), var(--dark1));
      border-radius: 10px; border: 1.5px solid var(--gold-dim);
      display: grid; grid-template-columns: repeat(3,1fr);
      gap: 4px; padding: 8px;
      box-shadow: inset 0 1px 0 #ffffff08;
    }
    .pip {
      border-radius: 50%;
      border: 1.5px solid #39FF6A55;
      background: transparent;
      transition: background 0.3s, box-shadow 0.3s;
    }
    .pip.lit {
      background: radial-gradient(circle at 35% 35%, #AFFFC6, #39FF6A);
      border-color: #AFFFC6;
      box-shadow: 0 0 5px #39FF6A88;
    }

    .card-info { flex: 1; min-width: 0; }
    .card-name {
      font-family: 'Rajdhani', sans-serif;
      font-weight: 700; font-size: 17px;
      color: var(--parchment);
      overflow: hidden; text-overflow: ellipsis; white-space: nowrap;
    }
    .card-season {
      font-family: 'Rajdhani', sans-serif;
      font-size: 10px; letter-spacing: 2px;
      text-transform: uppercase; margin-top: 1px;
    }
    .card-bar-wrap {
      margin-top: 7px; height: 3px;
      background: var(--dark0); border-radius: 2px; overflow: hidden;
    }
    .card-bar-fill { height: 100%; border-radius: 2px; transition: width 0.4s ease; }
    .card-winrate {
      font-size: 11px; color: var(--ash); margin-top: 3px;
    }

    /* Stats */
    .card-stats {
      display: flex; justify-content: space-around;
      padding: 10px 14px;
      border-top: 1px solid #ffffff08;
      border-bottom: 1px solid #ffffff08;
      background: #ffffff03;
    }
    .stat-block { text-align: center; }
    .stat-val {
      font-family: 'Orbitron', sans-serif;
      font-size: 16px; font-weight: 700;
    }
    .stat-label {
      font-family: 'Rajdhani', sans-serif;
      font-size: 9px; letter-spacing: 1.5px;
      text-transform: uppercase; color: var(--ash); margin-top: 1px;
    }

    /* Action buttons — bigger touch targets */
    .card-btns { display: flex; }
    .card-btns + .card-btns { border-top: 1px solid #ffffff05; }
    .act-btn {
      flex: 1; background: transparent;
      border: none; border-right: 1px solid #ffffff08;
      color: var(--ash);
      font-family: 'Rajdhani', sans-serif;
      font-size: 15px; font-weight: 700; letter-spacing: 1px;
      padding: 14px 4px;
      transition: background 0.15s, color 0.15s;
      -webkit-tap-highlight-color: transparent;
    }
    .act-btn:last-child { border-right: none; }
    .act-btn:active { background: #ffffff0D; }
    .act-btn.win  { color: var(--win); }
    .act-btn.loss { color: var(--loss); }
    .act-btn.tie  { color: var(--tie); }
    .act-btn.sub  { opacity: 0.4; font-size: 13px; }

    /* ── LEADERBOARD ── */
    .lb-list { display: flex; flex-direction: column; gap: 8px; }
    .lb-row {
      display: flex; align-items: center; gap: 10px;
      background: var(--dark2);
      border: 1px solid #ffffff0A;
      border-radius: 12px;
      padding: 12px;
    }
    .lb-rank {
      font-family: 'Orbitron', sans-serif;
      font-size: 15px; min-width: 26px; text-align: center;
    }
    .lb-icon { font-size: 22px; }
    .lb-meta { flex: 1; min-width: 0; }
    .lb-name {
      font-family: 'Rajdhani', sans-serif;
      font-weight: 700; font-size: 15px;
      color: var(--parchment);
      overflow: hidden; text-overflow: ellipsis; white-space: nowrap;
    }
    .lb-season {
      font-family: 'Rajdhani', sans-serif;
      font-size: 9px; letter-spacing: 2px; text-transform: uppercase; margin-top: 1px;
    }
    .lb-bar-wrap {
      margin-top: 4px; height: 2px;
      background: var(--dark0); border-radius: 2px; overflow: hidden;
    }
    .lb-stats { display: flex; gap: 10px; text-align: center; }
    .lb-stat-val {
      font-family: 'Orbitron', sans-serif;
      font-size: 13px; font-weight: 700;
    }
    .lb-stat-label {
      font-family: 'Rajdhani', sans-serif;
      font-size: 8px; letter-spacing: 1px;
      text-transform: uppercase; color: var(--ash);
    }

    /* Toolbar */
    .toolbar {
      display: flex; align-items: center; gap: 8px; margin-bottom: 10px;
    }
    .reset-btn {
      background: transparent;
      border: 1px solid #C0392B44;
      color: #C0392B88;
      border-radius: 8px;
      padding: 9px 12px;
      font-family: 'Rajdhani', sans-serif;
      font-size: 11px; letter-spacing: 1px;
      text-transform: uppercase;
    }

    /* Empty */
    .empty {
      text-align: center; padding: 80px 0; color: var(--dark4);
    }
    .empty-icon { font-size: 44px; margin-bottom: 14px; }
    .empty-title {
      font-family: 'Rajdhani', sans-serif;
      font-size: 18px; color: var(--ash);
    }
    .empty-sub { font-size: 13px; color: var(--dark4); margin-top: 6px; }
  </style>
</head>

<div id="root"></div>

const STORAGE_KEY = "dicethrone_stats_v1";

function loadStats() {
  try {
    const saved = localStorage.getItem(STORAGE_KEY);
    if (saved) {
      const parsed = JSON.parse(saved);
      const base = {};
      ALL_CHARACTERS.forEach(c => { base[c.id] = { wins:0, losses:0, ties:0 }; });
      return { ...base, ...parsed };
    }
  } catch(e) {}
  const s = {};
  ALL_CHARACTERS.forEach(c => { s[c.id] = { wins:0, losses:0, ties:0 }; });
  return s;
}

function Dice({ wins, losses, ties }) {
  const total = wins + losses + ties;
  const pct = total > 0 ? wins / total : 0;
  const filled = Math.round(pct * 6);
  const order = [[1,1],[0,0],[2,2],[0,2],[2,0],[1,0],[1,2]];
  const cells = [];
  for (let r=0;r<3;r++) for (let c=0;c<3;c++) {
    const idx = order.findIndex(([or,oc])=>or===r&&oc===c);
    cells.push(el('div', { key:`${r}-${c}`, className:'pip'+(idx>=0&&idx<filled?' lit':'') }));
  }
  return el('div', { className:'dice' }, ...cells);
}

function Card({ char, stats, onUpdate }) {
  const { wins, losses, ties } = stats;
  const total = wins + losses + ties;
  const pct = total > 0 ? Math.round((wins/total)*100) : 0;
  const ratio = losses > 0 ? (wins/losses).toFixed(2) : wins > 0 ? "∞" : "—";
  const btn = (label, action, cls) =>
    el('button', { className:`act-btn ${cls}`, onClick:()=>onUpdate(action) }, label);
  return el('div', {
    className:'card',
    style:{ borderColor: total>0 ? char.color+'44':undefined, boxShadow: total>0 ? `0 4px 20px ${char.color}18`:undefined }
  },
    el('div', { className:'card-top' },
      el(Dice, { wins, losses, ties }),
      el('div', { className:'card-info' },
        el('div', { className:'card-name' }, char.name+' '+char.icon),
        el('div', { className:'card-season', style:{ color:char.color } }, char.season),
        el('div', { className:'card-bar-wrap' },
          el('div', { className:'card-bar-fill', style:{ width:pct+'%', background:`linear-gradient(90deg,${char.color},#39FF6A)` } })
        ),
        el('div', { className:'card-winrate' }, total>0 ? `${pct}% win rate · ${total} game${total!==1?'s':''}` : 'No battles yet')
      )
    ),
    el('div', { className:'card-stats' },
      ...[ ['Wins',wins,'#4CAF50'],['Losses',losses,'#C0392B'],['Ties',ties,'#E67E22'],['W/L',ratio,'#39FF6A'] ]
        .map(([label,val,col])=>el('div',{key:label,className:'stat-block'},
          el('div',{className:'stat-val',style:{color:col}},val),
          el('div',{className:'stat-label'},label)
        ))
    ),
    el('div', { className:'card-btns' }, btn('+W','addWin','win'), btn('+L','addLoss','loss'), btn('+T','addTie','tie')),
    el('div', { className:'card-btns' }, btn('−W','subWin','sub'), btn('−L','subLoss','sub'), btn('−T','subTie','sub'))
  );
}

function App() {
  const [stats, setStats] = useState(loadStats);
  const [filter, setFilter] = useState("All");
  const [search, setSearch] = useState("");
  const [view, setView] = useState("roster");
  const [dropOpen, setDropOpen] = useState(false);

  useEffect(() => {
    if (!dropOpen) return;
    const close = () => setDropOpen(false);
    document.addEventListener('click', close);
    return () => document.removeEventListener('click', close);
  }, [dropOpen]);

  useEffect(() => {
    try { localStorage.setItem(STORAGE_KEY, JSON.stringify(stats)); } catch(e) {}
  }, [stats]);

  const handleUpdate = (id, action) => {
    setStats(prev => {
      const s = { ...prev[id] };
      if (action==="addWin")  s.wins   = s.wins+1;
      if (action==="addLoss") s.losses = s.losses+1;
      if (action==="addTie")  s.ties   = s.ties+1;
      if (action==="subWin")  s.wins   = Math.max(0,s.wins-1);
      if (action==="subLoss") s.losses = Math.max(0,s.losses-1);
      if (action==="subTie")  s.ties   = Math.max(0,s.ties-1);
      return { ...prev, [id]:s };
    });
  };

  const resetAll = () => {
    if (window.confirm("Reset ALL stats? This cannot be undone.")) {
      const s = {};
      ALL_CHARACTERS.forEach(c => { s[c.id] = {wins:0,losses:0,ties:0}; });
      setStats(s);
    }
  };

  const filtered = ALL_CHARACTERS.filter(c =>
    (filter==="All"||c.season===filter) &&
    c.name.toLowerCase().includes(search.toLowerCase())
  );

  const leaderboard = ALL_CHARACTERS
    .map(c => ({ ...c, ...stats[c.id], total: stats[c.id].wins+stats[c.id].losses+stats[c.id].ties }))
    .filter(c => c.total > 0)
    .sort((a,b) => (b.wins/b.total)-(a.wins/a.total));

  const totalGames = Object.values(stats).reduce((a,s)=>a+s.wins+s.losses+s.ties,0);
  const totalWins  = Object.values(stats).reduce((a,s)=>a+s.wins,0);
  const totalLosses = Object.values(stats).reduce((a,s)=>a+s.losses,0);
  const medals = ["🥇","🥈","🥉"];

  return el('div', null,
    // Tree silhouette backdrop
    el('div', { className:'tree-backdrop' },
      el('svg', { className:'layer-far', viewBox:'0 0 400 200', preserveAspectRatio:'xMidYMax slice', style:{height:'28vh'} },
        el('g', { fill:'#0F4A28' },
          el('path', { d:'M20 200 L20 120 Q5 110 15 95 Q0 90 12 75 Q-2 65 18 58 Q10 45 30 45 Q22 30 42 32 Q40 15 60 20 Q65 5 80 15 Q88 2 100 12 Q110 0 118 14 Q132 8 130 25 Q148 22 140 38 Q158 38 148 52 Q162 56 148 68 Q158 80 140 82 L140 200 Z' }),
          el('path', { d:'M260 200 L260 130 Q248 122 258 110 Q244 104 256 92 Q242 84 258 76 Q250 64 268 62 Q260 48 280 48 Q274 34 294 36 Q290 20 310 24 Q314 10 330 18 Q340 6 350 16 Q362 10 362 26 Q378 26 370 40 Q386 42 376 56 Q390 64 376 74 L376 200 Z' })
        )
      ),
      el('svg', { className:'layer-near', viewBox:'0 0 400 220', preserveAspectRatio:'xMidYMax slice', style:{height:'20vh'} },
        el('g', { fill:'#0A3018' },
          el('path', { d:'M0 220 L0 150 Q-10 140 2 128 Q-12 120 4 108 Q-10 96 8 90 Q0 75 22 76 Q14 58 38 60 Q34 42 58 46 Q56 28 80 32 Q86 16 104 26 Q116 10 128 24 Q142 14 144 32 Q162 28 156 46 Q176 46 168 62 Q186 68 172 80 L172 220 Z' }),
          el('path', { d:'M310 220 L310 145 Q298 136 310 122 Q294 114 308 100 Q292 90 310 82 Q300 66 324 66 Q316 46 342 48 Q338 28 364 32 Q368 14 390 22 Q400 8 400 24 L400 220 Z' })
        )
      )
    ),
    // Floating leaf particles
    el('div', { className:'leaf-particle', style:{ left:'8%',  animationDuration:'14s', animationDelay:'0s'  } }, '🍃'),
    el('div', { className:'leaf-particle', style:{ left:'22%', animationDuration:'19s', animationDelay:'3s'  } }, '🌿'),
    el('div', { className:'leaf-particle', style:{ left:'68%', animationDuration:'16s', animationDelay:'6s'  } }, '🍃'),
    el('div', { className:'leaf-particle', style:{ left:'85%', animationDuration:'21s', animationDelay:'1s'  } }, '🌿'),
    el('div', { className:'leaf-particle', style:{ left:'45%', animationDuration:'17s', animationDelay:'9s'  } }, '🍃'),

    el('div', { className:'header' },
      el('div', { className:'header-inner' },
        el('div', { className:'header-eyebrow' }, '⚔ Battle for the Throne ⚔'),
        el('div', { className:'header-logo' },
          el('h1', null, el('span',null,'DICE '),'THRONE')
        ),
        el('div', { style:{ fontFamily:"'Rajdhani', sans-serif", fontSize:13, fontWeight:700, letterSpacing:4, color:'#39FF6A', textTransform:'uppercase', marginTop:4, textShadow:'0 0 12px #39FF6A66' } }, 'Age of Vitality'),
        el('div', { className:'header-rule' }, el('span',null,'🌿')),
        el('div', { className:'header-sub' }, 'Win · Loss · Tie Tracker'),
      ),
      el('div', { className:'mad-king-wrap' },
        el('img', { src:MAD_KING, alt:'The Mad King' })
      ),
      totalGames > 0 && el('div', { className:'global-stats' },
        ...[ [totalGames,'Games','#39FF6A'],[totalWins,'Wins','#4CAF50'],[totalLosses,'Losses','#C0392B'],[Math.round((totalWins/totalGames)*100)+'%','Win Rate','#E8DCC8'] ]
          .map(([val,label,col])=>el('div',{key:label,className:'global-stat'},
            el('div',{className:'global-stat-val',style:{color:col}},val),
            el('div',{className:'global-stat-label'},label)
          ))
      )
    ),

    el('div', { className:'main' },
      view==='roster' && el('div', null,
        el('div', { className:'toolbar' },
          el('div', { className:'search-wrap', style:{flex:1} },
            el('span', { className:'search-icon' }, '🔍'),
            el('input', { className:'search-input', value:search, onChange:ev=>setSearch(ev.target.value), placeholder:'Search heroes...' })
          ),
          el('button', { className:'reset-btn', onClick:resetAll }, 'Reset')
        ),
        el('div', { className:'dropdown-wrap' },
          el('div', { style:{ fontSize:9, fontFamily:"'Rajdhani', sans-serif", letterSpacing:3, textTransform:'uppercase', color:'var(--gold-dim)', marginBottom:6 } }, 'Filter by Season'),
          el('button', {
            className:'dropdown-trigger'+(dropOpen?' open':''),
            onClick:(e)=>{ e.stopPropagation(); setDropOpen(o=>!o); }
          },
            el('span', null, filter),
            el('span', { className:'dropdown-arrow'+(dropOpen?' open':'') }, '▼')
          ),
          el('div', { className:'dropdown-menu'+(dropOpen?' open':'') },
            SEASONS.map(s=>el('button', {
              key:s,
              className:'dropdown-option'+(filter===s?' active':''),
              onClick:()=>{ setFilter(s); setDropOpen(false); }
            },
              el('span', null, s),
              filter===s && el('span', { className:'dropdown-option-check' }, '🌿')
            ))
          )
        ),
        (filter==="All"||filter==="Vanguard") && el('div',{className:'season-banner vanguard'},
          el('span',null,'✨'),
          el('span',null,el('strong',null,'Vanguard'),' — Arriving 2026.')
        ),
        (filter==="All"||filter==="Single Release Heroes") && el('div',{className:'season-banner single'},
          el('span',null,'🌟'),
          el('span',null,el('strong',null,'Single Release Heroes'),' — Alchemist & Mystic Brawler.')
        ),
        el('div', { className:'grid' },
          filtered.map(char=>el(Card,{key:char.id,char,stats:stats[char.id],onUpdate:a=>handleUpdate(char.id,a)}))
        ),
        filtered.length===0 && el('div',{className:'empty'},
          el('div',{className:'empty-icon'},'🎲'),
          el('div',{className:'empty-title'},'No heroes found'),
          el('div',{className:'empty-sub'},'Try a different search or filter.')
        )
      ),

      view==='leaderboard' && el('div', null,
        leaderboard.length===0
          ? el('div',{className:'empty'},
              el('div',{className:'empty-icon'},'🎲'),
              el('div',{className:'empty-title'},'The Hall of Fame awaits'),
              el('div',{className:'empty-sub'},'Log your first battle in the Roster.')
            )
          : el('div',{className:'lb-list'},
              leaderboard.map((c,i)=>{
                const wp = c.total>0?Math.round((c.wins/c.total)*100):0;
                const rl = c.losses>0?(c.wins/c.losses).toFixed(2):c.wins>0?'∞':'—';
                return el('div',{
                  key:c.id, className:'lb-row',
                  style: i<3 ? {background:`linear-gradient(135deg,${c.color}18 0%,#1C1729 100%)`,borderColor:c.color+'44'} : {}
                },
                  el('div',{className:'lb-rank'}, medals[i]||`#${i+1}`),
                  el('div',{className:'lb-icon'},c.icon),
                  el('div',{className:'lb-meta'},
                    el('div',{className:'lb-name'},c.name),
                    el('div',{className:'lb-season',style:{color:c.color}},c.season),
                    el('div',{className:'lb-bar-wrap'},
                      el('div',{style:{height:'100%',width:wp+'%',background:`linear-gradient(90deg,${c.color},#39FF6A)`,borderRadius:2}})
                    )
                  ),
                  el('div',{className:'lb-stats'},
                    ...[ ['W',c.wins,'#4CAF50'],['L',c.losses,'#C0392B'],['WIN%',wp+'%','#39FF6A'],['W/L',rl,'#E8DCC8'] ]
                      .map(([lbl,val,col])=>el('div',{key:lbl},
                        el('div',{className:'lb-stat-val',style:{color:col}},val),
                        el('div',{className:'lb-stat-label'},lbl)
                      ))
                  )
                );
              })
            )
      )
    ),

    el('div', { className:'bottom-nav' },
      ...[['roster','⚔️','Roster'],['leaderboard','🏆','Hall of Fame']].map(([v,icon,label])=>
        el('button',{key:v,className:'nav-btn'+(view===v?' active':''),onClick:()=>setView(v)},
          el('span',{className:'nav-btn-icon'},icon),
          label
        )
      )
    )
  );
}

ReactDOM.createRoot(document.getElementById('root')).render(el(App));
</script>
</body>
</html>
