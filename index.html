<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <meta name="apple-mobile-web-app-title" content="Dice Throne" />
  <meta name="theme-color" content="#03090A" />
  <title>DICE THRONE TRACKER</title>
  <link href="https://fonts.googleapis.com/css2?family=Pirata+One&family=Marcellus&family=Inter:wght@400;500;600&display=swap" rel="stylesheet" />
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    /* Emberforge — molten arena (default) */
    :root, [data-theme="emberforge"] {
      --gold:#E8A13A; --gold-dim:#9A5A1E; --glow:#FF9D42;
      --parchment:#F2E4D0; --ash:#A98C72;
      --dark0:#0B0705; --dark1:#140C07; --dark2:#1E130B; --dark3:#2E1D0F; --dark4:#45301A;
      --win:#5FBF6A; --loss:#D14233; --tie:#E0843A;
      --bloom:#E0452F; --bloom-soft:#F47A5E;
      --bg-a:#9A5A1E22; --bg-b:#E0452F12; --bg-c:#FF9D420A;
      --tree-far:#3A2410; --tree-near:#281806; --roots:#281806;
      --card-glow:rgba(232,161,58,0.20); --card-glow-soft:rgba(224,69,47,0.12);
    }
    /* Royal Amethyst — mystic regal */
    [data-theme="amethyst"] {
      --gold:#C9A24B; --gold-dim:#7A5E1E; --glow:#B98AE8;
      --parchment:#ECE6F2; --ash:#9A8FB0;
      --dark0:#07060E; --dark1:#0E0C18; --dark2:#161222; --dark3:#241B38; --dark4:#392B54;
      --win:#5FBF6A; --loss:#D14233; --tie:#E0A33A;
      --bloom:#8E5BD6; --bloom-soft:#B98AE8;
      --bg-a:#7A5E1E1E; --bg-b:#8E5BD614; --bg-c:#B98AE80A;
      --tree-far:#231938; --tree-near:#171026; --roots:#171026;
      --card-glow:rgba(201,162,75,0.18); --card-glow-soft:rgba(142,91,214,0.14);
    }
    /* Verdant Crown — Age of Vitality, gold-led forest */
    [data-theme="verdant"] {
      --gold:#C9A24B; --gold-dim:#6E5A1E; --glow:#D9B85A;
      --parchment:#ECEFE0; --ash:#95A085;
      --dark0:#060B06; --dark1:#0C140C; --dark2:#131E13; --dark3:#1E301E; --dark4:#2E462E;
      --win:#5FBF6A; --loss:#D14233; --tie:#E0A33A;
      --bloom:#3FA36A; --bloom-soft:#6FCB95;
      --bg-a:#6E5A1E1E; --bg-b:#3FA36A12; --bg-c:#D9B85A0A;
      --tree-far:#163A1E; --tree-near:#0F2A16; --roots:#0F2A16;
      --card-glow:rgba(201,162,75,0.16); --card-glow-soft:rgba(63,163,106,0.14);
    }
    /* Crimson Keep — blood arena */
    [data-theme="crimson"] {
      --gold:#C99A4B; --gold-dim:#7A4A1E; --glow:#FF6B5A;
      --parchment:#F2E2DE; --ash:#B08A82;
      --dark0:#0C0606; --dark1:#160A0A; --dark2:#201010; --dark3:#331717; --dark4:#4E2222;
      --win:#5FBF6A; --loss:#E0533F; --tie:#E0843A;
      --bloom:#D23A3A; --bloom-soft:#F06A6A;
      --bg-a:#7A4A1E1E; --bg-b:#D23A3A14; --bg-c:#FF6B5A0A;
      --tree-far:#3A1414; --tree-near:#280C0C; --roots:#280C0C;
      --card-glow:rgba(201,154,75,0.18); --card-glow-soft:rgba(210,58,58,0.14);
    }
    /* Frostforge — icy steel */
    [data-theme="frost"] {
      --gold:#7FC8E8; --gold-dim:#2E6F92; --glow:#A9E4FF;
      --parchment:#E6F2F8; --ash:#8AA6B4;
      --dark0:#04080C; --dark1:#081420; --dark2:#0E1E2E; --dark3:#163040; --dark4:#244A60;
      --win:#5FBF6A; --loss:#E0533F; --tie:#E0A33A;
      --bloom:#4FA3D9; --bloom-soft:#86C9EE;
      --bg-a:#2E6F921E; --bg-b:#4FA3D912; --bg-c:#A9E4FF0A;
      --tree-far:#123040; --tree-near:#0B2030; --roots:#0B2030;
      --card-glow:rgba(127,200,232,0.16); --card-glow-soft:rgba(79,163,217,0.12);
    }
    /* Abyssal Tide — deep teal */
    [data-theme="abyssal"] {
      --gold:#39C9B0; --gold-dim:#147A6A; --glow:#5FE6CC;
      --parchment:#DCF4EE; --ash:#7FA89E;
      --dark0:#03100E; --dark1:#06201C; --dark2:#0A2E28; --dark3:#114038; --dark4:#1A5A4E;
      --win:#5FE07A; --loss:#E0533F; --tie:#E0A33A;
      --bloom:#2BB39A; --bloom-soft:#66D9C2;
      --bg-a:#147A6A1E; --bg-b:#2BB39A14; --bg-c:#5FE6CC0A;
      --tree-far:#0E3A30; --tree-near:#082A22; --roots:#082A22;
      --card-glow:rgba(57,201,176,0.16); --card-glow-soft:rgba(43,179,154,0.12);
    }
    /* Sunspire — radiant gold + azure */
    [data-theme="sunspire"] {
      --gold:#F2C14E; --gold-dim:#B07A1E; --glow:#FFD970;
      --parchment:#FBF1DC; --ash:#B7A07A;
      --dark0:#0E0A06; --dark1:#1A130A; --dark2:#261C0E; --dark3:#3A2C14; --dark4:#564220;
      --win:#5FBF6A; --loss:#E0533F; --tie:#E08A2E;
      --bloom:#4FA0E0; --bloom-soft:#86C2F0;
      --bg-a:#B07A1E1E; --bg-b:#4FA0E012; --bg-c:#FFD9700A;
      --tree-far:#3A2A12; --tree-near:#281C0A; --roots:#281C0A;
      --card-glow:rgba(242,193,78,0.18); --card-glow-soft:rgba(79,160,224,0.12);
    }
    /* Nightbloom — arcane orchid + magenta */
    [data-theme="nightbloom"] {
      --gold:#C77BE0; --gold-dim:#6E2E86; --glow:#E6A0F5;
      --parchment:#F2E6F4; --ash:#A88FB0;
      --dark0:#0A060E; --dark1:#150A1C; --dark2:#1F1029; --dark3:#301840; --dark4:#48265E;
      --win:#5FBF6A; --loss:#E0533F; --tie:#E0A33A;
      --bloom:#E0459B; --bloom-soft:#F47AC0;
      --bg-a:#6E2E861E; --bg-b:#E0459B14; --bg-c:#E6A0F50A;
      --tree-far:#2A1438; --tree-near:#1C0C28; --roots:#1C0C28;
      --card-glow:rgba(199,123,224,0.16); --card-glow-soft:rgba(224,69,155,0.14);
    }

    html, body {
      height:100%; background:var(--dark0);
      background-image:
        radial-gradient(circle at 15% 20%, var(--bg-a) 0%, transparent 35%),
        radial-gradient(circle at 85% 78%, var(--bg-b) 0%, transparent 42%),
        radial-gradient(circle at 70% 12%, var(--bg-c) 0%, transparent 38%);
      color:var(--parchment); font-family:'Inter',sans-serif;
      overflow-x:hidden; -webkit-tap-highlight-color:transparent;
      transition:background .5s;
    }
    body { padding-top:env(safe-area-inset-top); padding-bottom:env(safe-area-inset-bottom); }
    button { font-family:'Inter',sans-serif; touch-action:manipulation; cursor:pointer; }
    input,select,textarea { font-family:'Inter',sans-serif; font-size:16px; }
    ::-webkit-scrollbar { width:0; }

    /* backdrop */
    .tree-backdrop { position:fixed; inset:0; z-index:0; pointer-events:none; opacity:.5; }
    .tree-backdrop svg { position:absolute; bottom:0; width:100%; height:auto; }
    .tree-backdrop .layer-far { opacity:.35; filter:blur(.5px); }
    .tree-backdrop .layer-near { opacity:.55; }
    .tree-fill-far { fill:var(--tree-far); transition:fill .5s; }
    .tree-fill-near { fill:var(--tree-near); transition:fill .5s; }
    .roots-stroke { stroke:var(--roots); transition:stroke .5s; }
    .leaf-particle { position:fixed; z-index:0; pointer-events:none; font-size:14px; opacity:.25;
      filter:drop-shadow(0 0 4px var(--glow)); animation:leafFall linear infinite; }
    @keyframes leafFall {
      0%{transform:translateY(-5vh) rotate(0) translateX(0); opacity:0;}
      10%{opacity:.3;} 90%{opacity:.2;}
      100%{transform:translateY(105vh) rotate(360deg) translateX(20px); opacity:0;}
    }

    /* ===== Treant's Grove atmosphere ===== */
    .grove-bg { position:fixed; inset:0; z-index:0; pointer-events:none; overflow:hidden; }
    .grove-bg::before { content:''; position:absolute; inset:0;
      background:
        radial-gradient(150% 75% at 50% -15%, transparent 32%, #00000070 100%),
        linear-gradient(180deg, rgba(2,14,8,0) 38%, var(--dark0) 100%); }
    .sun-ray { position:absolute; top:-14%; height:128%; transform-origin:top center; mix-blend-mode:screen;
      background:linear-gradient(180deg, var(--glow), transparent 70%); opacity:.12; filter:blur(3px);
      animation:rayPulse 9s ease-in-out infinite; }
    @keyframes rayPulse { 0%,100%{opacity:.07;} 50%{opacity:.22;} }

    .mote { position:fixed; bottom:-4vh; z-index:0; pointer-events:none; border-radius:50%; opacity:0;
      background:radial-gradient(circle, var(--glow) 0%, transparent 70%);
      filter:drop-shadow(0 0 6px var(--glow)); animation:moteRise linear infinite; }
    @keyframes moteRise {
      0%{transform:translate(0,0) scale(.5); opacity:0;}
      12%{opacity:.75;}
      55%{transform:translate(16px,-52vh) scale(1);}
      85%{opacity:.5;}
      100%{transform:translate(-14px,-104vh) scale(.6); opacity:0;}
    }

    .grove-fog { position:fixed; left:0; right:0; bottom:0; height:36vh; z-index:0; pointer-events:none; opacity:.75;
      background:linear-gradient(180deg, transparent 0%, var(--bg-a) 55%, var(--dark0) 100%); }
    .grove-fog::after { content:''; position:absolute; inset:0;
      background:radial-gradient(130% 90% at 50% 130%, var(--glow), transparent 60%); opacity:.07; }

    .grove-roots { position:fixed; left:0; right:0; bottom:0; z-index:0; pointer-events:none; opacity:.45; height:24vh; }
    .grove-roots svg { position:absolute; bottom:0; width:100%; height:100%; }

    /* header spirit-growth lore row */
    .spirit-row { display:flex; align-items:center; justify-content:center; gap:7px; margin-top:9px;
      font-family:'Marcellus',sans-serif; font-size:10px; font-weight:700; letter-spacing:2px;
      color:var(--ash); text-transform:uppercase; }
    .spirit-row .sg { color:var(--glow); display:inline-flex; align-items:center; gap:4px; }
    .spirit-row .arw { color:var(--gold-dim); font-size:11px; }
    .spirit-glyph { font-size:13px; filter:drop-shadow(0 0 5px var(--glow)); }

    /* header */
    .header { position:relative; z-index:10; text-align:center; overflow:visible;
      background:linear-gradient(180deg, var(--dark0) 0%, var(--dark2) 60%, var(--dark1) 100%);
      border-bottom:1px solid var(--gold-dim); box-shadow:inset 0 -12px 26px #00000055; }
    .header::after { content:''; position:absolute; left:0; right:0; bottom:-1px; height:2px;
      background:linear-gradient(90deg,transparent,var(--glow),transparent); opacity:.45; }
    .header-inner { padding:16px 16px 0; }
    .header h1 { font-family:'Pirata One',serif; font-weight:400; font-size:33px; letter-spacing:2px;
      color:var(--parchment); text-shadow:0 0 13px var(--glow), 0 2px 7px #000000aa; line-height:1; }
    .header h1 span { color:var(--gold); }
    .header-eyebrow { font-family:'Marcellus',sans-serif; font-size:9px; letter-spacing:5px;
      color:var(--gold-dim); text-transform:uppercase; margin-bottom:6px; }
    .header-tag { font-family:'Marcellus',sans-serif; font-size:12px; font-weight:700; letter-spacing:4px;
      color:var(--glow); text-transform:uppercase; margin-top:4px; text-shadow:0 0 7px var(--glow); }
    .header-rule { display:flex; align-items:center; gap:8px; margin:8px auto 0; max-width:220px; }
    .header-rule::before,.header-rule::after { content:''; flex:1; height:1px;
      background:linear-gradient(90deg,transparent,var(--gold-dim),transparent); }
    .header-rule span { font-size:12px; color:var(--gold-dim); }
    .header-sub { font-family:'Marcellus',sans-serif; font-size:11px; letter-spacing:3px;
      color:var(--ash); text-transform:uppercase; margin-top:4px; }
    .mad-king-wrap { position:relative; height:112px; margin-top:8px; overflow:visible; }
    .mad-king-wrap img { position:absolute; bottom:0; left:50%; transform:translateX(-50%);
      height:100px; filter:drop-shadow(0 0 12px var(--gold)) drop-shadow(0 0 22px var(--bloom)); pointer-events:none; }

    /* global stat strip */
    .global-stats { display:flex; justify-content:center; background:#00000033; border-top:1px solid #ffffff14; }
    .global-stat { flex:1; text-align:center; padding:9px 0; border-right:1px solid #ffffff14; }
    .global-stat:last-child { border-right:none; }
    .global-stat-val { font-family:'Marcellus',sans-serif; font-size:15px; font-weight:700; color:var(--gold); }
    .global-stat-label { font-size:8px; color:var(--ash); letter-spacing:1.5px; text-transform:uppercase; margin-top:1px; }

    /* bottom nav */
    .bottom-nav { position:fixed; bottom:0; left:0; right:0; z-index:100; display:flex;
      background:linear-gradient(180deg, var(--dark2), var(--dark1));
      border-top:1px solid var(--gold-dim); box-shadow:inset 0 3px 12px #00000055, 0 -6px 18px #00000040;
      padding-bottom:env(safe-area-inset-bottom); }
    .bottom-nav::before { content:''; position:absolute; top:-1px; left:0; right:0; height:2px;
      background:linear-gradient(90deg,transparent,var(--glow),transparent); opacity:.4; }
    .nav-btn { flex:1; background:transparent; border:none; color:var(--dark4); padding:10px 4px 9px;
      font-family:'Marcellus',sans-serif; font-size:9.5px; font-weight:700; letter-spacing:1.2px;
      text-transform:uppercase; display:flex; flex-direction:column; align-items:center; gap:3px; transition:color .15s, transform .15s; }
    .nav-btn.active { color:var(--gold); text-shadow:0 0 6px var(--glow); }
    .nav-btn.active .nav-btn-icon { transform:scale(1.12); filter:drop-shadow(0 0 6px var(--glow)); }
    .nav-btn-icon { font-size:19px; line-height:1; transition:transform .15s; }

    .main { position:relative; z-index:1; padding:14px 12px 92px; }

    /* search + filter */
    .search-wrap { position:relative; margin-bottom:10px; }
    .search-input { width:100%; background:var(--dark2); border:1px solid var(--gold-dim); border-radius:10px;
      padding:12px 14px 12px 40px; color:var(--parchment); font-size:16px; outline:none; -webkit-appearance:none; }
    .search-input::placeholder { color:var(--dark4); }
    .search-icon { position:absolute; left:13px; top:50%; transform:translateY(-50%); color:var(--dark4); font-size:15px; pointer-events:none; }

    .filter-row { display:flex; gap:8px; margin-bottom:12px; }
    .dropdown-wrap { position:relative; flex:1; z-index:50; }
    .dropdown-trigger { width:100%; display:flex; align-items:center; justify-content:space-between;
      background:var(--dark2); border:1px solid var(--gold-dim); border-radius:10px; padding:11px 14px;
      color:var(--gold); font-family:'Marcellus',sans-serif; font-size:13px; font-weight:700; letter-spacing:1.5px;
      text-transform:uppercase; transition:border-color .15s; }
    .dropdown-trigger.open { border-color:var(--gold); border-radius:10px 10px 0 0; }
    .dropdown-arrow { font-size:10px; transition:transform .2s; color:var(--gold-dim); }
    .dropdown-arrow.open { transform:rotate(180deg); }
    .dropdown-menu { position:absolute; top:100%; left:0; right:0; background:var(--dark2); border:1px solid var(--gold);
      border-top:none; border-radius:0 0 10px 10px; overflow-y:auto; max-height:0; transition:max-height .25s ease;
      z-index:999; box-shadow:0 12px 32px #000000aa; }
    .dropdown-menu.open { max-height:320px; }
    .dropdown-option { width:100%; display:flex; align-items:center; justify-content:space-between; background:transparent;
      border:none; border-top:1px solid #ffffff10; padding:12px 16px; color:var(--ash);
      font-family:'Marcellus',sans-serif; font-size:14px; font-weight:600; letter-spacing:1px; text-align:left; }
    .dropdown-option:first-child { border-top:none; }
    .dropdown-option:active { background:#ffffff0d; }
    .dropdown-option.active { color:var(--gold); background:#ffffff0d; }

    .toggle-pill { display:flex; align-items:center; gap:7px; background:var(--dark2); border:1px solid var(--gold-dim);
      border-radius:10px; padding:0 14px; color:var(--ash); font-family:'Marcellus',sans-serif; font-weight:700;
      font-size:12px; letter-spacing:1px; text-transform:uppercase; white-space:nowrap; }
    .toggle-pill.on { color:var(--gold); border-color:var(--gold); }

    /* banners */
    .season-banner { display:flex; align-items:center; gap:8px; border-radius:8px; padding:9px 12px; margin-bottom:12px;
      font-family:'Marcellus',sans-serif; font-size:13px; font-weight:600; }
    .season-banner.vanguard { background:#BF360C15; border:1px solid #F57F1733; color:#F57F17; }
    .season-banner.single { background:#7986CB15; border:1px solid #AB47BC33; color:#CE93D8; }

    /* cards */
    .grid { display:flex; flex-direction:column; gap:12px; }
    .card { position:relative; isolation:isolate; border:1px solid var(--dark4); border-radius:14px; overflow:hidden;
      transition:border-color .3s, box-shadow .3s, transform .3s;
      box-shadow:inset 0 1px 0 #ffffff10, 0 4px 14px #00000045;
      background:
        radial-gradient(135% 85% at 50% -12%, #ffffff08, transparent 55%),
        linear-gradient(162deg, var(--dark3) 0%, var(--dark1) 68%, var(--dark0) 100%); }
    .card::before { content:''; position:absolute; top:0; left:0; right:0; height:1px;
      background:linear-gradient(90deg,transparent,var(--gold-dim),transparent); opacity:.5; z-index:3; }
    .card::after { content:''; position:absolute; inset:0; border-radius:14px; pointer-events:none; z-index:0;
      mix-blend-mode:screen; opacity:.55;
      background:
        radial-gradient(64px 42px at 5% 100%, var(--card-glow), transparent 70%),
        radial-gradient(54px 36px at 97% 2%, var(--card-glow-soft), transparent 72%),
        linear-gradient(90deg, var(--glow) 0, var(--glow) 1.5px, transparent 2px); }
    .card:hover { border-color:var(--bloom); transform:translateY(-1px);
      box-shadow:inset 0 1px 0 #ffffff0a, inset 0 -3px 8px #00000045, 0 0 18px var(--bg-c); }
    .card-top { padding:8px 14px 10px; display:flex; align-items:center; gap:12px; position:relative; z-index:1; }
    .dice { width:50px; height:50px; flex-shrink:0; background:linear-gradient(135deg,var(--dark3),var(--dark1));
      border-radius:10px; border:1.5px solid var(--gold-dim); display:grid; grid-template-columns:repeat(3,1fr);
      gap:4px; padding:8px; box-shadow:inset 0 1px 0 #ffffff08; }
    .pip { border-radius:50%; border:1.5px solid var(--gold-dim); background:transparent; transition:background .3s, box-shadow .3s; }
    .pip.lit { background:radial-gradient(circle at 35% 35%, #fff, var(--glow)); border-color:#fff; box-shadow:0 0 5px var(--glow); }
    .card-info { flex:1; min-width:0; }
    .card-name-row { display:flex; align-items:center; gap:8px; }
    .card-name { font-family:'Marcellus',sans-serif; font-weight:700; font-size:17px; color:var(--parchment);
      overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
    .own-check { display:flex; align-items:center; gap:6px; font-family:'Marcellus',sans-serif; font-size:11px;
      font-weight:700; letter-spacing:1px; text-transform:uppercase; color:var(--ash); white-space:nowrap; cursor:pointer; }
    .own-check input { width:16px; height:16px; accent-color:var(--gold); cursor:pointer; }
    .own-check.on { color:var(--gold); }
    .rulepop-launch { display:flex; align-items:center; gap:12px; text-decoration:none; margin-bottom:14px;
      background:linear-gradient(135deg, var(--dark2), var(--dark1)); border:1px solid var(--gold-dim); border-radius:14px; padding:14px;
      box-shadow:0 0 18px var(--bg-c); }
    .rulepop-launch:active { border-color:var(--gold); }
    .rulepop-launch-icon { width:44px; height:44px; flex-shrink:0; display:flex; align-items:center; justify-content:center;
      font-size:22px; border-radius:11px; background:var(--dark0); border:1px solid var(--gold-dim); filter:drop-shadow(0 0 6px var(--glow)); }
    .rulepop-launch-title { font-family:'Marcellus',sans-serif; font-weight:700; font-size:14px; letter-spacing:1px; color:var(--parchment); }
    .rulepop-launch-sub { font-family:'Marcellus',sans-serif; font-size:12px; color:var(--ash); margin-top:2px; }
    .rulepop-launch-arrow { font-family:'Marcellus',sans-serif; font-size:18px; color:var(--gold); }
    .card-season { font-family:'Marcellus',sans-serif; font-size:10px; letter-spacing:2px; text-transform:uppercase; margin-top:1px; }
    .card-bar-wrap { margin-top:7px; height:3px; background:var(--dark0); border-radius:2px; overflow:hidden; }
    .card-bar-fill { height:100%; border-radius:2px; transition:width .4s ease; }
    .card-winrate { font-size:11px; color:var(--ash); margin-top:3px; }
    .card-stats { display:flex; justify-content:space-around; padding:10px 14px; border-top:1px solid #ffffff08;
      border-bottom:1px solid #ffffff08; background:#ffffff03; }
    .stat-block { text-align:center; } 
    .stat-val { font-family:'Marcellus',sans-serif; font-size:16px; font-weight:700; }
    .stat-label { font-family:'Marcellus',sans-serif; font-size:9px; letter-spacing:1.5px; text-transform:uppercase; color:var(--ash); margin-top:1px; }
    .card-btns { display:flex; position:relative; z-index:4; }
    .card-btns + .card-btns { border-top:1px solid #ffffff05; }

/* Treant's Grove: precomputed once so motes/rays stay stable across re-renders */
const GROVE_MOTES = Array.from({length:18},()=>({
  width:(3+Math.random()*5).toFixed(1)+'px',
  height:'0px',
  left:(Math.random()*100).toFixed(1)+'%',
  animationDuration:(15+Math.random()*16).toFixed(1)+'s',
  animationDelay:(-Math.random()*26).toFixed(1)+'s',
}));
GROVE_MOTES.forEach(m=>{ m.height=m.width; });
const GROVE_RAYS = [0,1,2,3,4,5].map(i=>({
  left:(4+i*17)+'%',
  width:(5+ (i%3)*2.5)+'vw',
  transform:'rotate('+(-7+i*2.6).toFixed(1)+'deg)',
  animationDelay:(-i*1.6).toFixed(1)+'s',

/* ---------- storage / migration ---------- */
const KEY = "dicethrone_data_v2";
const LEGACY_KEY = "dicethrone_stats_v1";

function freshData() {
  return { schema:2, matches:[], legacy:{}, owned:{}, avatars:{}, prefs:{ theme:"emberforge" } };
}
function loadData() {
  const VALID_THEMES = ["emberforge","crimson","sunspire","verdant","abyssal","frost","amethyst","nightbloom"];
  const norm = (d)=>{ if(!d.avatars)d.avatars={}; if(!VALID_THEMES.includes(d.prefs.theme))d.prefs.theme="emberforge"; return d; };
  try {
    const raw = localStorage.getItem(KEY);
    if (raw) { const d = JSON.parse(raw); return norm({ ...freshData(), ...d, prefs:{ ...freshData().prefs, ...(d.prefs||{}) } }); }
  } catch(e) {}
  // migrate v1 counters → legacy baseline (no one loses progress)
  const d = freshData();
  try {
    const old = localStorage.getItem(LEGACY_KEY);
    if (old) { const s = JSON.parse(old); ALL_CHARACTERS.forEach(c => { if (s[c.id]) d.legacy[c.id] = { wins:s[c.id].wins||0, losses:s[c.id].losses||0, ties:s[c.id].ties||0 }; }); }
  } catch(e) {}
  return d;
}

/* derive combined per-hero record from legacy baseline + logged matches */
function recordFor(data, heroId) {
  const r = { wins:0, losses:0, ties:0 };
  const L = data.legacy[heroId]; if (L) { r.wins+=L.wins||0; r.losses+=L.losses||0; r.ties+=L.ties||0; }
  data.matches.forEach(m => { if (m.heroId===heroId) { if(m.result==='win')r.wins++; else if(m.result==='loss')r.losses++; else r.ties++; } });
  return r;
}
function matchupsFor(data, heroId) {
  const map = {};
  data.matches.forEach(m => {
    if (m.heroId!==heroId || !m.opponentId) return;
    map[m.opponentId] = map[m.opponentId] || { w:0,l:0,t:0 };
    if(m.result==='win')map[m.opponentId].w++; else if(m.result==='loss')map[m.opponentId].l++; else map[m.opponentId].t++;
  });
  return Object.entries(map).map(([id,r])=>({ id, ...r, total:r.w+r.l+r.t })).sort((a,b)=>b.total-a.total);
}
/* Wilson lower-bound: balances WIN COUNT and WIN % so a 25-5 hero outranks a 1-0 hero,
   and heroes with the most losses / lowest % fall to the bottom. */
function powerScore(wins, losses) {
  const n = wins + losses;
  if (n === 0) return 0;
  const z = 1.96, p = wins / n;
  return (p + z*z/(2*n) - z*Math.sqrt((p*(1-p) + z*z/(4*n))/n)) / (1 + z*z/n);
}

/* downscale an uploaded image to a small square JPEG so localStorage stays light */
function fileToAvatar(file, cb){
  const reader=new FileReader();
  reader.onload=()=>{ const img=new Image();
    img.onload=()=>{ const S=168, c=document.createElement('canvas'); c.width=S; c.height=S;
      const ctx=c.getContext('2d'); const scale=Math.max(S/img.width, S/img.height);
      const w=img.width*scale, h=img.height*scale; ctx.drawImage(img,(S-w)/2,(S-h)/2,w,h);
      try{ cb(c.toDataURL('image/jpeg',0.82)); }catch(e){ cb(null); } };
    img.onerror=()=>cb(null); img.src=reader.result; };
  reader.onerror=()=>cb(null); reader.readAsDataURL(file);
}

      el('button',{className:'quick-btn clear', onClick:()=>clearOwned(filtered.map(c=>c.id))}, '\u2715 Clear These')),
    el('div',{className:'grid'},
      filtered.map(c=>el(Card,{ key:c.id, char:c, rec:recordFor(data,c.id), owned:!!data.owned[c.id], avatar:effSrc(data,c.id), hasCustom:!!data.avatars[c.id],
        onUpdate:a=>adjust(c.id,a), onToggleOwn:()=>toggleOwn(c.id), onOpen:()=>setDetailHero(c.id), onSetAvatar:(f)=>setAvatar(c.id,f), onRevert:()=>clearAvatar(c.id) }))),
    filtered.length===0 && el('div',{className:'empty'},
      el('div',{className:'empty-icon'},'🎲'), el('div',{className:'empty-title'},'No heroes found'),
      el('div',{className:'empty-sub'},'Try a different search or season.'))
  );

  const recentAll = data.matches.slice().reverse();
  const logView = el('div',null,
    el('div',{className:'section-title'},'📜 Match Log'),
    el('button',{className:'btn-primary', style:{marginBottom:16}, onClick:()=>{ setLogHero(''); setLogOpen(true); }},'+ Log a Match'),
    el('div',{className:'panel-title', style:{marginLeft:2}}, recentAll.length+' logged game'+(recentAll.length!==1?'s':'')),
    recentAll.length===0
      ? el('div',{className:'empty'}, el('div',{className:'empty-icon'},'🗒️'), el('div',{className:'empty-title'},'No matches logged yet'),
          el('div',{className:'empty-sub'},'Logged games power matchups, streaks & history. Quick +W/−W on the Roster still works too.'))
      : recentAll.map(m=>{
          const h=HERO[m.heroId], o=m.opponentId?HERO[m.opponentId]:null;
          return el('div',{key:m.id,className:'hist-row '+m.result},
            el('div',{className:'hist-icon'}, h?h.icon:'🎲'),
            el('div',{className:'hist-main'},
              el('div',{className:'hist-line'}, (h?h.name:'Hero') + (o?` vs ${o.name}`:'')),
              el('div',{className:'hist-sub'}, new Date(m.date).toLocaleDateString(), hpChip(m), (m.notes?(' · '+m.notes):''))),
            el('div',{className:'hist-res '+m.result}, m.result.toUpperCase()),
            el('button',{className:'hist-del', onClick:()=>deleteMatch(m.id), title:'Delete'},'✕'));
        })
  );

  const hallView = el('div',null,
    el('div',{className:'section-title'},'🏆 Mightiest Heroes'),
    el('div',{className:'stat-grid'},
      [[totalGames,'Total Games'],[winRate+'%','Overall Win Rate'],
       [streak>0?streak:'—', streak>0?(streakType==='win'?'Win Streak':'Loss Streak'):'No Streak'],
       [ownedCount+'/'+ALL_CHARACTERS.length,'Heroes Owned']]
        .map(([v,l])=>el('div',{key:l,className:'stat-chip'}, el('div',{className:'stat-chip-val'},v), el('div',{className:'stat-chip-label'},l)))),
    topHero && el('div',{className:'panel', style:{textAlign:'center'}},
      el('div',{className:'panel-title'},'Top Hero'),
      el('div',{style:{display:'flex',justifyContent:'center',margin:'2px 0 4px'}}, el(Avatar,{char:topHero, src:effSrc(data,topHero.id), size:64})),
      el('div',{style:{fontFamily:"'Marcellus'",fontWeight:900,fontSize:18,letterSpacing:2,marginTop:4}},topHero.name),
      el('div',{style:{color:'var(--gold)',fontFamily:"'Marcellus'",letterSpacing:1,marginTop:2}}, Math.round(topHero.wins/topHero.total*100)+`% · ${topHero.wins}-${topHero.losses}-${topHero.ties}`)),
    el('div',{className:'panel-title', style:{marginLeft:2}}, 'Top 10 — ranked by wins & win %'),
    leaderboard.length===0
      ? el('div',{className:'empty'}, el('div',{className:'empty-icon'},'🎲'), el('div',{className:'empty-title'},'The Hall awaits'), el('div',{className:'empty-sub'},'Log your first battle.'))
      : el('div',{className:'lb-list'},
          leaderboard.map((c,i)=>{
            const wp=c.total>0?Math.round(c.wins/c.total*100):0;
            const rl=c.losses>0?(c.wins/c.losses).toFixed(2):(c.wins>0?'∞':'—');
            return el('div',{key:c.id, className:'lb-row',
              style:i<3?{background:`linear-gradient(135deg,${c.color}22 0%, var(--dark2) 100%)`, borderColor:c.color+'55'}:{}, onClick:()=>setDetailHero(c.id)},
              el('div',{className:'lb-rank'}, medals[i]||`#${i+1}`),
              el(Avatar,{char:c, src:effSrc(data,c.id), size:38}),
              el('div',{className:'lb-meta'},
                el('div',{className:'lb-name'},c.name),
                el('div',{className:'lb-season',style:{color:c.color}},c.season),
                el('div',{className:'lb-bar-wrap'}, el('div',{style:{height:'100%',width:wp+'%',background:'linear-gradient(90deg,var(--gold),var(--bloom))',borderRadius:2}}))),
              el('div',{className:'lb-stats'},
                [['W',c.wins,'var(--win)'],['L',c.losses,'var(--loss)'],['WIN%',wp+'%','var(--glow)'],['W/L',rl,'var(--parchment)']]
                  .map(([l,v,col])=>el('div',{key:l}, el('div',{className:'lb-stat-val',style:{color:col}},v), el('div',{className:'lb-stat-label'},l)))));
          }))
  );

  const ownedList = ALL_CHARACTERS.filter(c=>data.owned[c.id]);
  const draftPool = draftMode==='owned' ? ownedList : ALL_CHARACTERS;
  const poolReady = draftPool.length>0;
  const changeCount = (n)=>{ if(spinning)return; setDraftCount(n); setSlots(emptySlots(n)); setRand(null); setActiveSlot(-1); };
  const resetDraft = ()=>{ setSlots(emptySlots(draftCount)); setRand(null); setActiveSlot(-1); };
  const rollRandom = ()=>{
    if(spinning || !poolReady) return;
    spinRef.current.forEach(t=>clearTimeout(t)); spinRef.current=[];
    const cols = draftCount;
    const avail = Math.min(cols, draftPool.length);
    const pool=[...draftPool]; const picks=[];
    for(let i=0;i<avail;i++){ picks.push(pool.splice(Math.floor(Math.random()*pool.length),1)[0]); }
    const firstPlayer = Math.floor(Math.random()*cols)+1;
    setRand(null); setSlots(emptySlots(cols)); setSpinning(true);
    const runSlot=(i)=>{
      if(i>=cols){ setActiveSlot(-1); setSpinning(false); setRand({ picks, firstPlayer }); return; }
      const pick=picks[i];
      const next=()=>{ spinRef.current.push(setTimeout(()=>runSlot(i+1), 150)); };
      if(!pick){ setSlots(s=>s.map((sl,idx)=>idx===i?{hero:null,locked:true,tick:sl.tick+1}:sl)); next(); return; }
      setActiveSlot(i);
      const seq=[]; for(let k=0;k<7;k++)seq.push(44); [60,90,140,200].forEach(d=>seq.push(d));
      let t=0;
      seq.forEach(dl=>{ t+=dl; spinRef.current.push(setTimeout(()=>{
        const r=draftPool[Math.floor(Math.random()*draftPool.length)];
        setSlots(s=>s.map((sl,idx)=>idx===i?{hero:r,locked:false,tick:sl.tick+1}:sl));
      }, t)); });
      t+=130;
      spinRef.current.push(setTimeout(()=>{
        setSlots(s=>s.map((sl,idx)=>idx===i?{hero:pick,locked:true,tick:sl.tick+1}:sl));
        next();
      }, t));
    };
    runSlot(0);
  };

  const toolsView = el('div',null,
    el('div',{className:'section-title'},'🎲 Draft & Randomizer'),
    el('div',{className:'panel'},
      el('div',{className:'field'},
        el('label',null,'Draft pool'),
        el('div',{className:'seg'},
          el('button',{className:'seg-btn'+(draftMode==='all'?' sel':''), onClick:()=>{ if(spinning)return; setDraftMode('all'); resetDraft(); }},'All Heroes'),
          el('button',{className:'seg-btn'+(draftMode==='owned'?' sel':''), disabled:ownedList.length===0,
            onClick:()=>{ if(spinning||!ownedList.length)return; setDraftMode('owned'); resetDraft(); }},'My Owned ('+ownedList.length+')'))),
      draftMode==='owned' && ownedList.length===0 &&
        el('div',{style:{color:'var(--ash)',fontSize:12,marginTop:-6,marginBottom:12,lineHeight:1.4}},'No heroes marked owned yet — use “Own All” on the Roster tab.'),
      el('div',{className:'field'},
        el('label',null,'How many players?'),
        el('select',{className:'input', value:draftCount, disabled:spinning, onChange:e=>changeCount(+e.target.value)},
          [1,2,3,4,5,6].map(n=>el('option',{key:n,value:n},n)))),
      el('div',{className:'pick-grid'+(draftCount===1?' single':'')},
        slots.map((sl,i)=>{
          const rolling = spinning && activeSlot===i && !sl.locked;
          const isFirst = !!rand && (i+1===rand.firstPlayer) && sl.locked;
          const ph = { name:'—', icon:'🎲', color:'#8a7a5e' };
          const innerCls = rolling ? 'roll-anim' : ((sl.locked&&sl.hero) ? 'lock-anim' : '');
          return el('div',{key:i, className:'pick-card'+(rolling?' rolling':'')+(sl.locked&&sl.hero?' locked':'')+(isFirst?' first':'')},
            el('div',{className:'pick-player'}, 'Player '+(i+1)+(isFirst?' ⚑':'')),
            el('div',{key:sl.tick, className:'pick-inner '+innerCls},
              el(Avatar,{char: sl.hero||ph, src: sl.hero?effSrc(data,sl.hero.id):null, size:46, cls: sl.hero?'':'ghost'}),
              el('div',{className:'pick-name'}, sl.hero?sl.hero.name:(sl.locked?'—':'Ready')),
              el('div',{className:'pick-season', style:{color: sl.hero?sl.hero.color:'var(--ash)'}}, sl.hero?sl.hero.season:(rolling?'rolling…':'awaiting'))));
        })),
      el('button',{className:'btn-primary', disabled:spinning||!poolReady, style:(spinning||!poolReady)?{opacity:.55}:{}, onClick:rollRandom}, spinning?'Rolling…':(rand?'🎲 Randomize Again':'🎲 Randomize')),
      rand && !spinning && el('div',{style:{textAlign:'center',marginTop:14,fontFamily:"'Marcellus'",letterSpacing:1.5,color:'var(--gold)',fontWeight:700}},'⚑ First player: Player '+rand.firstPlayer)),

    el('div',{className:'section-title'},'📖 Rules'),
    el('a',{className:'rulepop-launch', href:'https://dice-throne.rulepop.com/', target:'_blank', rel:'noopener'},
      el('div',{className:'rulepop-launch-icon'},'🔍'),
      el('div',{style:{flex:1}},
        el('div',{className:'rulepop-launch-title'},'Open Rule Pop'),
        el('div',{className:'rulepop-launch-sub'},'Full searchable card & rules database ↗')),
      el('div',{className:'rulepop-launch-arrow'},'↗')),

    el('div',{className:'section-title'},'🎨 Theme'),
    el('div',{className:'panel'},
      el('div',{className:'tile-grid'},
        THEMES.map(t=>el('button',{key:t.id,className:'theme-tile'+(data.prefs.theme===t.id?' sel':''), onClick:()=>setPrefs({theme:t.id})},
          el('div',{className:'theme-name'},t.name),
          el('div',{className:'theme-swatches'}, t.swatches.map((s,i)=>el('div',{key:i,className:'sw',style:{background:s}}))))))),

    el('div',{className:'section-title'},'💾 Data'),
    el('div',{className:'panel'},
      el('div',{style:{color:'var(--ash)',fontSize:12,marginBottom:12,lineHeight:1.5}},'Back up your stats before Firebase cloud sync arrives, or move them to a new device.'),
      el('div',{className:'btn-row', style:{marginBottom:10}},
        el('button',{className:'btn-ghost', onClick:exportData},'⬇ Export Backup'),
        el('label',{className:'btn-ghost', style:{textAlign:'center',cursor:'pointer'}}, '⬆ Import',
          el('input',{type:'file', accept:'application/json', style:{display:'none'}, onChange:e=>{ if(e.target.files[0])importData(e.target.files[0]); }}))),
      el('button',{className:'btn-ghost', style:{color:'var(--loss)',borderColor:'var(--loss)'}, onClick:resetAll},'⚠ Reset All Data'))
  );

  const NAV = [['roster','⚔️','Roster'],['log','📜','Log'],['hall','🏆','Mighty'],['tools','🧰','Tools']];

  return el('div',null,
    ...motes, header,
    el('div',{className:'main'},
      view==='roster'&&rosterView, view==='log'&&logView, view==='hall'&&hallView, view==='tools'&&toolsView),
    el('div',{className:'bottom-nav'},
      NAV.map(([v,ic,lb])=>el('button',{key:v,className:'nav-btn'+(view===v?' active':''),onClick:()=>setView(v)},
        el('span',{className:'nav-btn-icon'},ic), lb))),
    logOpen && el(LogModal,{ defaultHero:logHero, onSave:saveMatch, onClose:()=>setLogOpen(false) }),
    detailHero && el(HeroModal,{ data, heroId:detailHero, onClose:()=>setDetailHero(null), onSetAvatar:setAvatar, onClearAvatar:clearAvatar })
  );
}

ReactDOM.createRoot(document.getElementById('root')).render(el(App));
(function(){var s=document.getElementById('splash');if(!s)return;var start=performance.now();function go(){var wait=Math.max(0,650-(performance.now()-start));setTimeout(function(){s.classList.add('hide');setTimeout(function(){s.remove();},600);},wait);}requestAnimationFrame(function(){requestAnimationFrame(go);});})();

</script>
</body>
</html>
